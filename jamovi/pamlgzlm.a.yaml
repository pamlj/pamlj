---
name: pamlgzlm
title: Generalized Linear Model
menuGroup: Power
version: '0.0.1'
jas: '1.2'
export: false
completeWhenFilled: false
description:
    main: |
           Power analysis for generalized linear models with binary, ordinal, or multinomial outcomes, based on eta-squared or R-squared effect sizes.

options:
    - name: data
      type: Data
      description:
                R: the data as a data frame


    -   name: model_type
        title: Model Selection
        type: List
        options:
            -   name: logistic
                title: Logistic
            -   name: ordinal
                title: Ordinal (proportional odds)
            -   name: multinomial
                title: Multinomial


    - name: aim
      title: Calculate 
      type:  List
      default: n
      options:
        - name:  n
          title: N
        - name: power
          title: Power
        - name: es
          title: Effect Size

    - name: mode
      title: "Effect size type"
      type: List
      options:
            - name: eta
              title: Eta-squared
            - name: r2
              title: R-squared
      default: eta

      

    - name: r2_es
      title: R-squared 
      type:  Number
      default: .05

    - name: r2_df
      title: Model degrees of freedom 
      type:  Number
      default: 1
      min: 0

    - name: eta_es
      title: Expected Eta-squared (η²)
      type:  Number
      default: .1

    - name: eta_df
      title: Effect degrees of freedom 
      type:  Number
      default: 1
      min: 1

    - name: y_levels
      title:  Levels 
      type:  Number
      default: 2
      min: 2

    - name: y_prop
      title:  Prop. in larger level 
      type:  Number
      default: .5
      min: 0
      max: .90

    - name: power
      title: Minimal desired power 
      type:  Number
      default: .90

    - name: n
      title: N 
      type:  Number
      default: 20

    - name: sig.level
      title: 'α (type I error rate)'
      type:  Number
      default: .05


    - name: plot_contour
      title: Power contour plot
      type: Bool
      default: false

    - name: plot_escurve
      title: Power curve by effect size
      type: Bool
      default: false
      
    - name: plot_ncurve
      title: Power curve by N
      type: Bool
      default: false

    - name: plot_log
      title: Log Scale (when needed)
      type: Bool
      default: false

    - name: plot_palette
      title: Colors
      type: List
      default: viridis
      options:
             - name:  viridis
               title: Viridis
             - name:  rocket
               title: Rocket
             - name:  mako
               title: Mako
             - name:  cividis
               title: Cividis
             - name:  plasma
               title: Plasma
             - name:  turbo
               title: Turbo
             - name:  husky
               title: Husky (grey)

    - name: covs
      title: Number of covariates
      type:  Number
      default: 0
      min: 0
    - name: factors
      title: Number of factors
      type:  Number
      default: 0
      min: 0

    - name: factors_list
      title: Factors
      type: Array
      default:
        - var: factor 1
          levels: 0
      template:
          type: Group
          elements:
            - name: var
              type: String
            - name: levels
              type: Integer

    - name: covs_order
      title: Max Order
      type: List
      default: main
      options:
        -       name:  main
                title: Main Effects
        -       name:  order2
                title: Up to 2-way
        -       name:  order3
                title: Up to 3-way
        -       name:  orderall
                title: All possible

    - name: factors_order
      title: Max Order
      type: List
      default: main
      options:
        -       name:  main
                title: Main Effects
        -       name:  order2
                title: Up to 2-way
        -       name:  order3
                title: Up to 3-way
        -       name:  orderall
                title: All possible

    - name: mixed_order
      title: Factors Covariates interactions
      type: List
      default: none
      options:
        -       name:  none
                title: None
        -       name:  order2
                title: Up to 2-way
        -       name:  order3
                title: Up to 3-way
        -       name:  orderall
                title: All possible


 

### custom plots 
    

    - name: plot_x
      type: List
      title: "X-axis values"
      default: none
      options:
        - name: none
          title: "----"
        - name: n
          title: N
        - name: power
          title: Power
        - name: es
          title: Effect size
        - name: sig.level
          title: "Type I error"

    - name: plot_y
      type: List
      title: "Y-axis values"
      default: none
      options:
        - name: none
          title: "-----"
        - name: n
          title: N
        - name: power
          title: Power
        - name: es
          title: Effect size

    - name: plot_custom_labels
      type: Bool
      title: "Value labels"
      default: false

    - name: plot_z
      default: none
      type: List
      title: "Parameter"
      options:
        - name: none
          title: "-----"
        - name: n
          title: N
        - name: power
          title: Power
        - name: es
          title: Effect size
        - name: sig.level
          title: "Type I error"



    - name: plot_x_from
      type: Number
      title: "From"
      default: 0
    - name: plot_x_to
      type: Number
      title: "To"
      default: 0


    - name: plot_z_lines
      type: Number
      title: "# lines"
      default: 0

    - name: plot_z_value
      type: Array
   #   hidden: true
      default: []
      template:
          type: String

    - name: plot_to_table
      type: Bool
      title: "Results table"
      default: false
      
    - name: explain
      type: Bool
      title: "Explanatory text"
      default: false
      
    - name: .caller
      type: String
      default: gzlm
      hidden: true

    - name: .interface
      type: String
      default: jamovi
      hidden: true

...
