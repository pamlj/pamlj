title: Generalized Linear Model Power Analysis
name: pamlgzlm
jus: '3.0'
stage: 0
compilerMode: tame
events:
  update: ./pamlgzlm::update
children:
  - type: LayoutBox
    margin: large
    children:
      - type: ComboBox
        name: aim

  - type: LayoutBox
    margin: large
    children:
          - type: Label
            label: Model Type
            children:
              - type: RadioButton
                name: model_type_logistic
                optionName: model_type
                optionPart: logistic
              - type: RadioButton
                name: model_type_ordinal
                optionName: model_type
                optionPart: ordinal
              - type: RadioButton
                name: model_type_multinomial
                optionName: model_type
                optionPart: multinomial
                

  - type: ModeSelector
    name: mode
    stretchFactor: 1
    children:
      - type: Content
        name: eta
        children:
          - type: LayoutBox
            margin: large
            children:
              - type: Label
                label: Effect information
                children:
                  - name: eta_es
                    type: TextBox
                    format: number
                    enable: (!aim:es)
                  - type: TextBox
                    name: eta_df
                    format: number
      - type: Content
        name: r2
        children:
          - type: LayoutBox
            margin: large
            children:
              - type: Label
                label: Effect information
                children:
                  - name: r2_es
                    type: TextBox
                    format: number
                    enable: (!aim:es)
                  - type: TextBox
                    name: r2_df
                    format: number
  - type: LayoutBox
    margin: large
    children:
      - type: Label
        label: Dependent variable
        style: inline
        children:
          - name: y_levels
            type: TextBox
            format: number
            enable: (!model_type:logistic)
          - name: y_prop
            type: TextBox
            format: number

  - type: LayoutBox
    margin: large
    children:
      - type: Label
        label: Parameters
        children:
          - name: power
            type: TextBox
            label: Minimum desired power
            format: number
            enable: (!aim:power)
          - name: n
            type: TextBox
            label: N (Sample size)
            format: number
            enable: (!aim:n)
          - name: sig.level
            type: TextBox
            format: number
          - type: ComboBox
            name: alternative
      - type: Label
        label: Info
        children:
          - name: explain
            type: CheckBox
  - type: CollapseBox
    label: Sensitivity Analysis
    name: panel_sensitivity
    collapsed: true
    stretchFactor: 1
    children:
      - type: LayoutBox
        children:
          - type: LayoutBox
            style: inline
            children:
              - type: Label
                label: Plots
                children:
                  - type: CheckBox
                    name: plot_contour
                  - type: CheckBox
                    name: plot_escurve
                  - type: CheckBox
                    name: plot_ncurve
              - type: Label
                label: Options
                children:
                  - name: plot_log
                    type: CheckBox
                  - type: ComboBox
                    name: plot_palette
  - type: CollapseBox
    label: Power Parameters Plot
    name: panel_customplot
    collapsed: true
    stretchFactor: 1
    children:
      - type: LayoutBox
        children:
          - type: LayoutBox
            style: inline
            children:
              - type: Label
                label: Plot Y-axis
                children:
                  - type: LayoutBox
                    style: inline
                    children:
                      - type: ComboBox
                        name: plot_y
                      - type: CheckBox
                        name: plot_custom_labels
              - type: Label
                label: Results in table
                children:
                  - type: CheckBox
                    name: plot_to_table
          - type: Label
            label: Plot X-axis
            children:
              - type: LayoutBox
                style: inline
                children:
                  - type: ComboBox
                    name: plot_x
                    events:
                      change: ./common::plot_x_changed
                  - type: TextBox
                    name: plot_x_from
                    format: number
                  - type: TextBox
                    name: plot_x_to
                    format: number
          - type: Label
            label: Plot Different Curves by
            children:
              - type: LayoutBox
                style: inline
                children:
                  - type: ComboBox
                    name: plot_z
                    events:
                      change: ./common::plot_z_changed
                  - type: TextBox
                    name: plot_z_lines
                    format: number
                    enable: (!plot_z:none)
                    events:
                      change: ./common::plot_z_lines_changed
          - type: LayoutBox
            name: plot_lines_values
            children:
              - type: Label
                label: Values for each curves
                name: plot_value_label
                children:
                  - type: ListBox
                    name: plot_z_value
                    events:
                      listItemAdded: ./common::onChange_value_added
                      listItemRemoved: ./common::onChange_value_removed
                    showColumnHeaders: false
                    columns:
                      - name: var
                        label: Value
                        template:
                          type: TextBox
  - type: CollapseBox
    label: Model Definition
    name: panel_model
    collapsed: true
    stretchFactor: 1
    children:
      - type: LayoutBox
        children:
          - type: Label
            label: Variables in the model
            children:
              - type: LayoutBox
                style: inline
                children:
                  - name: covs
                    type: TextBox
                    format: number
                    events:
                      change: ./pamlgzlm::onChange_factors_list_change
                  - name: covs_order
                    type: ComboBox
                    events:
                      change: ./pamlgzlm::onChange_factors_list_change
              - type: LayoutBox
                style: inline
                children:
                  - name: factors
                    type: TextBox
                    format: number
                    events:
                      change: ./pamlgzlm::onChange_factors
                  - name: factors_order
                    type: ComboBox
                    events:
                      change: ./pamlgzlm::onChange_factors_list_change
          - type: Label
            name: factors_group
            label: Factors definition
            children:
              - type: ListBox
                name: factors_list
                fullRowSelect: true
                height: large
                events:
                  change: ./pamlgzlm::onChange_factors_list_change
                showColumnHeaders: true
                columns:
                  - name: var
                    label: Name
                    template:
                      type: Label
                  - name: levels
                    label: N levels (groups)
                    events: null
                    template:
                      type: TextBox
                      format: number
              - name: mixed_order
                type: ComboBox
                events:
                  change: ./pamlgzlm::onChange_factors_list_change
